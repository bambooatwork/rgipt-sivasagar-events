# One-click deploy of the FULL app (events + registration + admin panel) to Render.
# Render → New → Blueprint → point at this repo.
services:
  - type: web
    name: rgipt-sivasagar-events
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # set a strong password when prompted
      - key: PYTHON_VERSION
        value: "3.12.6"
